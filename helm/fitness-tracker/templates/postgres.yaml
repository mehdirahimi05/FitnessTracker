apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: {{ .Release.Name }}-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-db
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-db
    spec:
      containers:
          - name: postgres
            image: "{{ .Values.postgresql.image }}"
            env:
              - name: POSTGRES_DB
                value: "{{ .Values.postgresql.database }}"
              - name: POSTGRES_USER
                value: "{{ .Values.postgresql.username }}"
              - name: POSTGRES_PASSWORD
                value: "{{ .Values.postgresql.password }}"
            ports:
              - containerPort: {{ .Values.postgresql.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: {{ .Values.postgresql.port }}
  selector:
    app: {{ .Release.Name }}-db