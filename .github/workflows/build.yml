name: FitnessTracker CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ==========================================
  # JOB 1: Kompilieren, Linting & Artefakte
  # ==========================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile and Lint (Checkstyle)
        run: mvn -B clean compile checkstyle:check

      - name: Package JARs
        run: mvn -B package -DskipTests

      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-jars
          path: |
            storage/target/*.jar
            api/target/*.jar
          retention-days: 7

  # ==========================================
  # JOB 2: Unit-Tests, Coverage & SonarQube
  # ==========================================
  test-and-analyze:
    name: Test & SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository (Full clone for SonarQube)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Tests, JaCoCo & SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=FitnessTracker \
            -Dsonar.projectName='FitnessTracker'

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            storage/target/site/jacoco/
            api/target/site/jacoco/
          retention-days: 7

  # ==========================================
  # JOB 3: Docker Build & Push (Versioning)
  # ==========================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-analyze
    # Docker Push nur bei Push auf main/develop oder manuellem Trigger ausführen
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          VERSION=${{ github.sha }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:$VERSION .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:$VERSION
          docker push ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:latest

  # ==========================================
  # JOB 4: Continuous Deployment (Release)
  # ==========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deployment via Docker Compose auf Zielhost per SSH
      - name: Deploy via SSH to Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fitness-tracker || mkdir -p /opt/fitness-tracker && cd /opt/fitness-tracker
            docker compose down
            docker pull ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:latest
            docker compose up -d