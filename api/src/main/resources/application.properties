# Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:fitness_tracker}
spring.datasource.username=${DB_USER:devops}
spring.datasource.password=${DB_PASSWORD:password}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:fitness-tracker-secret-key-minimum-256-bit-long-string}
jwt.expiration=86400000